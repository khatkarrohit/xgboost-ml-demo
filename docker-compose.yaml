services:
  xgboost-demo:
    build: .
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          # Total memory limit for the container (including heap and native)
          # With -Xmx256m, if native memory exceeds ~60MB, the container will be OOMKilled
          memory: 320M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
